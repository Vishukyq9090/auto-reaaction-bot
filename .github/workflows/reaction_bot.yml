name: Auto Reaction Bot 24x7

on:
  push:
    branches:
      - main
  schedule:
    - cron: '25 */5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-reaction-bot-live
  cancel-in-progress: true

jobs:
  run-reaction-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (5.5 Hours Cycle)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ADMIN_ID: "7412791600"
        run: timeout --signal=SIGINT 19800s python -u bot.py || true

      - name: Auto Restart Next Session
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run reaction_bot.yml --repo ${{ github.repository }} || true
